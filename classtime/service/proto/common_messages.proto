syntax = "proto3";

// NOTE: DO NOT ADD MORE MESSAGES TO THIS FILE! IF YOU ARE TEMPTED TO ADD SOMETHING HERE, ASK MICHA FOR ADVICE!

package classtime.service.common;

import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "CommonMessagesProto";
option java_package = "classtime.service.common";

enum FeedbackMode {
  reserved 2;
  MANUAL = 0;
  PER_QUESTION = 1;
}

enum GameStatus {
  NONE = 0;
  SETUP = 1;
  STARTED = 2;
  FINISHED = 3;
}

enum PusherCluster {
  EU = 0;
  US = 1;
  SOKETI = 2;
}

enum SessionAccess {
  READ_ONLY = 0;
  READ_WRITE = 1;
}

message Team {
  int32 id = 1;
  repeated string members = 2;
}

// Make sure always sync with getAcquisitionChannel implementation.
message AcquisitionChannel {
  string utm_source = 1;
  string utm_medium = 2;
  oneof channel {
    string referrer = 3;
    string utm_campaign = 4;
    string gclid = 5;
    string gclsrc = 6;
    string fbclid = 7;
  }
  string landing_page = 8;
}

message FeatureFlag {
  string flag_name = 1;
  oneof flag_value {
    bool boolean_value = 2;
    string string_value = 3;
    int32 number_value = 4;
  }
}

message GradingPoint {
  int32 points_centis = 1; // Points multiplied by a factor 100
}

message GradedGap {
  string answer_id = 1;
  int32 gap_index = 2;
  bool is_correct = 3;
}

message QuestionTag {
  string id = 1;
  string name = 2;
  string description = 3;
  string url = 4;
}

message CollaboratorInfo {
  reserved 2;
  string collaborator_id = 1; // classtime_id
  string email = 3;
}

message PlaylistEntry {
  string question_set_id = 1;
  // Question ids to include or empty to include all questions from the question set.
  repeated string selected_question_ids = 2;
}

extend google.protobuf.MessageOptions {
  bool public_api = 50001;
}

message RawFileUpload {
  bytes content = 1;
  string name = 2;
  optional string content_type = 3;
}

message SearchFilter {
  string id = 1;
  string value = 2;
}

message TagBreadcrumb {
  string tag = 1;
  string description = 2;
}

message BreadCrumb {
  string id = 1;
  string title = 2;
  string icon_image = 3;
}

message QuestionBank {
  int32 id = 1;
  bool is_subscribed = 2;
  bool is_paid_content = 3;
  google.protobuf.Timestamp subscription_period_end = 4;
}

enum SpellCheckMode {
  SPELL_CHECK_MODE_UNSPECIFIED = 0;
  SPELL_CHECK_MODE_UNDERLINE = 1;
  SPELL_CHECK_MODE_SUGGEST = 2;
}
