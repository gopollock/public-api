/*
 * All supported groups. Groups can be static (boolean, enum groups) and dynamic (string, int groups).
 * Dynamic groups allow to store additional information for each user and allows indefinite group branching.
 */
message UserGroupType {
  reserved 6, 16;
  oneof this_group {
    bool group_all_users = 3;

    bool group_classtime = 1;
    bool group_classtime_testers = 15;
    bool group_beta_testers = 2;
    bool group_careum = 13;
    bool group_lexmea = 14;
    bool group_wings = 17;

    bool group_is_trial_available = 12;
    bool group_new_onboarding = 25;
    bool group_with_ai_comments_enabled = 21;
    bool group_with_ai_validation_disabled = 18;
    bool group_with_disabled_websockets = 19;
    bool group_with_new_resource_pool = 22;
    bool group_with_organization = 7;
    bool group_with_organization_collaboration = 8;
    bool group_with_premium_subscription = 9;
    bool group_with_purchased_challenge_legacy = 20;

    string group_with_custom_logo = 4;
    Theme group_with_custom_theme = 11;
    DataRealm group_with_data_realm = 10;
    string group_with_organization_country_code = 5;
    OrganizationGroup group_with_organization_group = 24;
    string group_with_primary_email = 23;
  }
}

/*
 * Root entity.
 * Controls the list of groups with which account is associated. It defines a features available for the account.
 */
message UserGroup {
  classtime.entity.EntityRef account_ref = 1;
  repeated UserGroupType user_groups = 2;
}

/* defines for which groups and their percentage is feature available */
message UserGroupPercentLaunch {
  UserGroupType group = 1;
  int32 percent = 2;
}

/* Root entity. Controls the visibility of features for different groups */
message LaunchControl {
  /* reference numeric value of the FeatureFlags field */
  int32 feature_flag_field_id = 1;
  repeated UserGroupPercentLaunch user_group_percent_launched = 2;
}
